<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invitation For Sweety ❤️</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Background Music -->
    <audio id="bgMusic" loop>
        <source src="assets/music.mp3" type="audio/mpeg">
    </audio>

    <!-- Music Button -->
    <button id="musicBtn">
        🎵
    </button>

    <!-- Hearts -->
    <div id="hearts"></div>

    <!-- Sparkles -->
    <div id="sparkles"></div>

    <!-- Main Container -->
    <div class="container">

        <!-- Envelope -->

        <div class="envelope" id="envelope">

            <div class="flap"></div>

            <div class="front"></div>

            <div class="open-text">
                OPEN
            </div>

            <!-- Invitation Card -->

            <div class="card" id="card">

                <h1>Invitation</h1>

                <h3>For Upcoming Date</h3>

                <div class="divider"></div>

                <p><span>From</span><br>
                    Mehedi Hasan Tusar
                </p>

                <p>
    <span>To</span><br>
    <span class="to-name">Sweety ❤️</span>
</p>
                    
             

                <p><span>Date</span><br>
                    13 August 2026
                </p>

                <p><span>Time</span><br>
                    3:00 PM
                </p>

                <p><span>Location</span><br>
                    Lapino 🍕
                </p>

                <div class="divider"></div>

                <h2>
                    With Love ❤️
                </h2>

                <small>
                    Every beautiful moment begins with a simple invitation.
                </small>

            </div>

        </div>

    </div>

    <!-- Rose Petals -->

    <div class="petals">

        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- Open Sound -->

    <audio id="paperSound">
        <source src="assets/open.mp3" type="audio/mpeg">
    </audio>

    <!-- Javascript -->

    <script src="script.js"></script>

</body>

</html>
